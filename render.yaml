# Render.com Infrastructure as Code - FIXED VERSION
services:
  # PostgreSQL Database
  - type: pserv
    name: elite-tena-database
    plan: free
    databaseName: elite_tena_db
    databaseUser: elite_tena_user

  # Web Service (Backend)
  - type: web
    name: elite-tena-backend
    env: node
    plan: free
    repo: https://github.com/Nutoli12/Elite_Tena
    branch: feature/system-restructure
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: NODE_VERSION
        value: 18
      - key: JWT_SECRET
        value: elite-tena-super-secure-jwt-secret-2024
      - key: CORS_ORIGINS
        value: https://elite-tena-healthcare.netlify.app
      - key: SESSION_SECRET
        value: elite-tena-session-secret-2024
      - key: ADMIN_EMAIL
        value: admin@elitetena.com
      - key: ADMIN_PASSWORD
        value: admin123
      - key: CHAPA_SECRET_KEY
        value: CHASECK_TEST-jP1PvRveaH0GqCRiN8O4AucVDvZQjhq
      - key: CHAPA_PUBLIC_KEY
        value: CHASECK_TEST-jP1PvRveaH0GqCRiN8O4AucVDvZQjhq
      - key: CONTRACT_ADDRESS
        value: 0x2c0cE04B1013451660f62DE12924404bead3894
      - key: BLOCKCHAIN_RPC_URL
        value: https://eth-sepolia.g.alchemy.com/v2/-bDd7BdV8nVlJ8WOpcO8Z
      - key: DAILY_API_KEY
        value: 26c5ee3911d07cd67e36fa6c75fedade6ba19056e2e4db3a428f200
      - key: DAILY_DOMAIN
        value: Elitetena.daily.co
